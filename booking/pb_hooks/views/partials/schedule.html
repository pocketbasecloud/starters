{{range .days}}
<section class="agenda-day">
  <h2 class="agenda-date zen-text zen-type-body-extra-bold" data-tone="strongest">{{.label}} <span class="zen-text zen-type-body-small-regular" data-tone="light">{{.count}}</span></h2>
  <ul class="agenda">
    {{range .bookings}}
    <li class="zen-card agenda-item" data-tone="shadow" data-spacing="medium" id="booking-{{.id}}"><div class="zen-card__content agenda-row">
      <span class="agenda-time"><strong class="zen-type-body-base-bold">{{.time}}</strong><span class="zen-type-body-small-regular">{{.minutes}} min</span></span>
      <span class="agenda-who">
        <span class="zen-text zen-type-body-base-medium" data-tone="strongest">{{.name}} · {{.service}}</span>
        <a class="zen-link zen-type-body-small-regular" data-tone="hyperlink" data-underline="hover" href="mailto:{{.email}}">{{.email}}</a>
        {{if .notes}}<span class="zen-text zen-type-body-small-regular agenda-notes" data-tone="base">{{.notes}}</span>{{end}}
      </span>
      <button type="button" class="zen-button" data-size="sm" data-appearance="main" data-level="secondary" data-variant="secondary"
        hx-patch="/staff/bookings/{{.id}}/cancel" hx-confirm="Cancel this booking with {{.name}}?" hx-swap="none"><span class="zen-button__label zen-type-button-label-s">Cancel</span></button>
    </div></li>
    {{end}}
  </ul>
</section>
{{else}}
<section class="zen-empty-state"><div class="zen-empty-state__body"><div class="zen-empty-state__content">
  <h3 class="zen-empty-state__title zen-type-heading-4">No bookings yet</h3>
  <p class="zen-empty-state__caption zen-type-body-base-regular">New bookings appear here as soon as they are made.</p>
</div></div></section>
{{end}}
