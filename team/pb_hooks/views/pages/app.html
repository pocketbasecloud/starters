{{define "content"}}
<section id="welcome" class="auth" hidden>
  <div class="zen-card auth-card" data-tone="shadow" data-spacing="large"><div class="zen-card__content">
    <div class="auth-heading">
      <span class="mark" aria-hidden="true"></span>
      <h1 class="zen-text zen-heading zen-type-heading-2" data-tone="strongest">{{.site}}</h1>
      <p class="zen-text zen-type-body-base-regular" data-tone="base">{{if .open.invite}}Sign in or create an account to join your team.{{else}}Projects and tasks for your whole team, in one place.{{end}}</p>
    </div>
    <div class="zen-segmented" data-level="secondary" data-size="medium" role="group" aria-label="Account" data-name="auth">
      <button type="button" class="zen-segmented__item" data-size="medium" data-state="default" data-value="signin" data-selected="true" aria-pressed="true"><span class="zen-segmented__label zen-type-body-base-bold">Sign in</span></button>
      <button type="button" class="zen-segmented__item" data-size="medium" data-state="default" data-value="signup" data-selected="false" aria-pressed="false"><span class="zen-segmented__label zen-type-body-base-bold">Create account</span></button>
    </div>
    <form id="signin-form" class="stack" data-auth="signin">
      <div class="zen-input-field" data-size="medium" data-state="default">
        <span class="zen-input-label zen-type-body-small-regular" data-state="default"><span class="zen-input-label__content"><label class="zen-input-label__text" for="signin-email">Email</label></span></span>
        <div class="zen-input__control"><input id="signin-email" class="zen-input__native zen-type-body-base-medium" name="email" type="email" autocomplete="username" required></div>
      </div>
      <div class="zen-input-field" data-size="medium" data-state="default">
        <span class="zen-input-label zen-type-body-small-regular" data-state="default"><span class="zen-input-label__content"><label class="zen-input-label__text" for="signin-password">Password</label></span></span>
        <div class="zen-input__control"><input id="signin-password" class="zen-input__native zen-type-body-base-medium" name="password" type="password" autocomplete="current-password" required></div>
      </div>
      <div class="error-slot"></div>
      <button type="submit" class="zen-button" data-size="md" data-appearance="main" data-level="primary" data-variant="primary"><span class="zen-button__label zen-type-button-label-m">Sign in</span></button>
    </form>
    <form id="signup-form" class="stack" data-auth="signup" hidden>
      <div class="zen-input-field" data-size="medium" data-state="default">
        <span class="zen-input-label zen-type-body-small-regular" data-state="default"><span class="zen-input-label__content"><label class="zen-input-label__text" for="signup-name">Your name</label></span></span>
        <div class="zen-input__control"><input id="signup-name" class="zen-input__native zen-type-body-base-medium" name="name" autocomplete="name" maxlength="60" required></div>
      </div>
      <div class="zen-input-field" data-size="medium" data-state="default">
        <span class="zen-input-label zen-type-body-small-regular" data-state="default"><span class="zen-input-label__content"><label class="zen-input-label__text" for="signup-email">Email</label></span></span>
        <div class="zen-input__control"><input id="signup-email" class="zen-input__native zen-type-body-base-medium" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="zen-input-field" data-size="medium" data-state="default">
        <span class="zen-input-label zen-type-body-small-regular" data-state="default"><span class="zen-input-label__content"><label class="zen-input-label__text" for="signup-password">Password</label></span></span>
        <div class="zen-input__control"><input id="signup-password" class="zen-input__native zen-type-body-base-medium" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
      </div>
      <div class="error-slot"></div>
      <button type="submit" class="zen-button" data-size="md" data-appearance="main" data-level="primary" data-variant="primary"><span class="zen-button__label zen-type-button-label-m">Create account</span></button>
    </form>
  </div></div>
</section>

<div id="workspace" class="workspace" data-team="{{.open.team}}" data-project="{{.open.project}}" data-view="{{.open.view}}" data-invite="{{.open.invite}}" hidden>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="/"><span class="mark" aria-hidden="true"></span><span class="zen-text zen-type-heading-4" data-tone="strongest">{{.site}}</span></a>
      <div class="account">
        <span id="who" class="zen-text zen-type-body-small-regular" data-tone="base"></span>
        <button id="signout" type="button" class="zen-button" data-size="sm" data-appearance="main" data-level="secondary" data-variant="secondary"><span class="zen-button__icon" aria-hidden="true">{{template "icon-log-out"}}</span><span class="zen-button__label zen-type-button-label-s">Sign out</span></button>
      </div>
    </div>
  </header>
  <div class="error-slot"></div>
  <div id="main" class="main"></div>
</div>
{{end}}
