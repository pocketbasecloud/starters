<div class="profile">
  {{if .avatar}}<img class="avatar" src="{{.avatar}}" alt="" width="64" height="64">{{else}}<span class="avatar mark" aria-hidden="true"></span>{{end}}
  <div class="profile-text">
    <h2 class="zen-text zen-type-heading-4" data-tone="strongest">{{.name}}</h2>
    <p class="zen-text zen-type-body-base-regular" data-tone="base">{{.email}}{{if .verified}} · verified by Google{{end}}</p>
    <p class="zen-text zen-type-body-small-regular" data-tone="base">Member since {{.joined}}</p>
  </div>
</div>
